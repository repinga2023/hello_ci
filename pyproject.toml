[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-world-cli"
version = "0.1.0"
description = "A simple CLI that prints Hello world in different cases"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Foo", email = "foo@barbar.org" },
]
license = { text = "MIT" }

[project.scripts]
hello = "hello.hello:main"

